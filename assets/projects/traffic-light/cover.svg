<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Two traffic lights with a green, amber, red timing bar">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="640" height="400" fill="#0c1322"/>
  <rect width="640" height="400" fill="url(#g)"/>

  <!-- ground -->
  <line x1="40" y1="292" x2="600" y2="292" stroke="#2a3650" stroke-width="2"/>
  <line x1="250" y1="292" x2="390" y2="292" stroke="#c9d2e3" stroke-width="2" stroke-dasharray="14 10" opacity="0.35"/>

  <!-- left signal: red -->
  <line x1="180" y1="250" x2="180" y2="292" stroke="#3a4766" stroke-width="8"/>
  <rect x="140" y="50" width="80" height="200" rx="14" fill="#141d30" stroke="#3a4766" stroke-width="2"/>
  <circle cx="180" cy="95" r="24" fill="#f87171"/>
  <circle cx="180" cy="95" r="24" fill="none" stroke="#f87171" stroke-opacity="0.35" stroke-width="6"/>
  <circle cx="180" cy="150" r="24" fill="#1f2a40"/>
  <circle cx="180" cy="205" r="24" fill="#1f2a40"/>

  <!-- right signal: green -->
  <line x1="460" y1="250" x2="460" y2="292" stroke="#3a4766" stroke-width="8"/>
  <rect x="420" y="50" width="80" height="200" rx="14" fill="#141d30" stroke="#3a4766" stroke-width="2"/>
  <circle cx="460" cy="95" r="24" fill="#1f2a40"/>
  <circle cx="460" cy="150" r="24" fill="#1f2a40"/>
  <circle cx="460" cy="205" r="24" fill="#34d399"/>
  <circle cx="460" cy="205" r="24" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="6"/>

  <!-- prox sensor between -->
  <rect x="300" y="262" width="40" height="18" rx="4" fill="#141d30" stroke="#ffb627" stroke-width="2"/>
  <path d="M320 256c-10-8-10-22 0-30M320 256c10-8 10-22 0-30" fill="none" stroke="#ffb627" stroke-opacity="0.5" stroke-width="2"/>

  <!-- timing bar -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#94a0b8">
    <rect x="60" y="322" width="260" height="16" rx="3" fill="#34d399"/>
    <rect x="320" y="322" width="173" height="16" rx="3" fill="#ffb627"/>
    <rect x="493" y="322" width="87" height="16" rx="3" fill="#f87171"/>
    <text x="60" y="362">GREEN 9 s</text>
    <text x="320" y="362">AMBER 6 s</text>
    <text x="493" y="362">RED 3 s</text>
  </g>
</svg>
