<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Conveyor with boxes, drive motor, 10 second shutoff timer and pilot lights">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="640" height="400" fill="#0c1322"/>
  <rect width="640" height="400" fill="url(#g)"/>

  <!-- pilot lights -->
  <g>
    <rect x="48" y="40" width="150" height="56" rx="10" fill="#141d30" stroke="#3a4766" stroke-width="2"/>
    <circle cx="80" cy="68" r="14" fill="#34d399"/>
    <circle cx="123" cy="68" r="14" fill="#1f2a40"/>
    <circle cx="166" cy="68" r="14" fill="#34d399" opacity="0.55"/>
    <circle cx="166" cy="68" r="20" fill="none" stroke="#34d399" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- shutoff timer dial -->
  <g font-family="ui-monospace, Menlo, monospace">
    <circle cx="530" cy="92" r="52" fill="#141d30" stroke="#3a4766" stroke-width="2"/>
    <path d="M530 40 A52 52 0 1 1 480.5 108" fill="none" stroke="#ffb627" stroke-width="6" stroke-linecap="round"/>
    <text x="530" y="100" text-anchor="middle" font-size="24" font-weight="600" fill="#e8ecf4">10 s</text>
    <text x="530" y="168" text-anchor="middle" font-size="12" fill="#94a0b8">AUTO SHUTOFF</text>
  </g>

  <!-- boxes on belt -->
  <rect x="120" y="196" width="70" height="56" rx="4" fill="#2a3650" stroke="#94a0b8" stroke-width="2"/>
  <rect x="270" y="186" width="84" height="66" rx="4" fill="#2a3650" stroke="#94a0b8" stroke-width="2"/>
  <rect x="430" y="200" width="64" height="52" rx="4" fill="#2a3650" stroke="#94a0b8" stroke-width="2"/>
  <path d="M120 214h70M270 206h84M430 216h64" stroke="#94a0b8" stroke-opacity="0.4" stroke-width="2"/>

  <!-- belt -->
  <rect x="60" y="252" width="520" height="34" rx="17" fill="#141d30" stroke="#c9d2e3" stroke-width="2"/>
  <g fill="#0c1322" stroke="#94a0b8" stroke-width="2">
    <circle cx="77" cy="269" r="11"/><circle cx="160" cy="269" r="8"/><circle cx="240" cy="269" r="8"/>
    <circle cx="320" cy="269" r="8"/><circle cx="400" cy="269" r="8"/><circle cx="480" cy="269" r="8"/><circle cx="563" cy="269" r="11"/>
  </g>
  <path d="M250 312h140m-14-8 14 8-14 8" fill="none" stroke="#ffb627" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- motor -->
  <line x1="77" y1="280" x2="77" y2="322" stroke="#94a0b8" stroke-width="3"/>
  <circle cx="77" cy="344" r="24" fill="#141d30" stroke="#c9d2e3" stroke-width="2"/>
  <text x="77" y="352" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="20" font-weight="700" fill="#e8ecf4">M</text>
</svg>
