<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Start and stop push buttons above a seal-in ladder rung">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="640" height="400" fill="#0c1322"/>
  <rect width="640" height="400" fill="url(#g)"/>

  <!-- push buttons -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="200" y="40" width="240" height="96" rx="14" fill="#141d30" stroke="#3a4766" stroke-width="2"/>
    <circle cx="270" cy="82" r="26" fill="#1c2638" stroke="#3a4766" stroke-width="2"/>
    <circle cx="270" cy="82" r="18" fill="#34d399"/>
    <text x="270" y="126" fill="#94a0b8">START</text>
    <circle cx="370" cy="82" r="26" fill="#1c2638" stroke="#3a4766" stroke-width="2"/>
    <circle cx="370" cy="82" r="18" fill="#f87171"/>
    <text x="370" y="126" fill="#94a0b8">STOP</text>
  </g>

  <!-- ladder rails -->
  <g stroke="#c9d2e3" stroke-width="3">
    <line x1="60" y1="170" x2="60" y2="360"/>
    <line x1="580" y1="170" x2="580" y2="360"/>
  </g>

  <!-- rung (energized path in green) -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <!-- main rung -->
    <path d="M60 230H150M170 230H260M280 230H460M520 230H580" stroke="#34d399"/>
    <!-- XIO stop -->
    <path d="M150 210v40M170 210v40M150 250 170 210" stroke="#34d399"/>
    <!-- XIC start -->
    <path d="M260 210v40M280 210v40" stroke="#94a0b8"/>
    <!-- seal-in branch -->
    <path d="M200 230v80H260M280 310H340V230" stroke="#34d399"/>
    <path d="M260 290v40M280 290v40" stroke="#34d399"/>
    <!-- coil -->
    <path d="M470 206q-14 24 0 48M510 206q14 24 0 48" stroke="#34d399"/>
    <line x1="460" y1="230" x2="466" y2="230" stroke="#34d399"/>
    <line x1="514" y1="230" x2="520" y2="230" stroke="#34d399"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle" fill="#94a0b8">
    <text x="160" y="198">STOP</text>
    <text x="270" y="198">START</text>
    <text x="270" y="350">RUN</text>
    <text x="490" y="198" fill="#34d399">RUN</text>
    <text x="320" y="380" fill="#64708a">3-WIRE SEAL-IN</text>
  </g>
</svg>
