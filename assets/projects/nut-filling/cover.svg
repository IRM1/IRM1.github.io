<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Two hoppers filling a labeled box on a conveyor, with photo eyes reading the label">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="640" height="400" fill="#0c1322"/>
  <rect width="640" height="400" fill="url(#g)"/>

  <!-- hoppers -->
  <g stroke="#c9d2e3" stroke-width="2">
    <path d="M190 40h120l-40 70v24h-40v-24z" fill="#141d30"/>
    <path d="M340 40h120l-40 70v24h-40v-24z" fill="#141d30"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">
    <text x="250" y="70" fill="#f87171">PECANS</text>
    <text x="400" y="70" fill="#38bdf8">WALNUTS</text>
  </g>
  <!-- solenoid open on pecan hopper -->
  <rect x="226" y="134" width="48" height="10" rx="2" fill="#34d399"/>
  <rect x="376" y="134" width="48" height="10" rx="2" fill="#2a3650" stroke="#3a4766"/>

  <!-- falling nuts -->
  <g fill="#b45309" stroke="#78350f">
    <ellipse cx="242" cy="160" rx="6" ry="4"/><ellipse cx="256" cy="172" rx="6" ry="4"/>
    <ellipse cx="246" cy="186" rx="6" ry="4"/><ellipse cx="258" cy="198" rx="6" ry="4"/>
  </g>

  <!-- box -->
  <rect x="200" y="206" width="100" height="78" rx="4" fill="#2a3650" stroke="#c9d2e3" stroke-width="2"/>
  <ellipse cx="236" cy="216" rx="7" ry="4" fill="#b45309"/><ellipse cx="252" cy="214" rx="7" ry="4" fill="#b45309"/><ellipse cx="268" cy="217" rx="7" ry="4" fill="#b45309"/>
  <rect x="226" y="242" width="48" height="22" rx="3" fill="#f87171"/>

  <!-- photo eyes -->
  <rect x="110" y="236" width="28" height="18" rx="3" fill="#141d30" stroke="#f87171" stroke-width="2"/>
  <rect x="110" y="262" width="28" height="18" rx="3" fill="#141d30" stroke="#38bdf8" stroke-width="2"/>
  <line x1="138" y1="245" x2="226" y2="250" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="138" y1="271" x2="200" y2="271" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 4" opacity="0.4"/>

  <!-- level switch -->
  <line x1="300" y1="222" x2="330" y2="222" stroke="#ffb627" stroke-width="2"/>
  <rect x="330" y="214" width="18" height="16" rx="3" fill="#141d30" stroke="#ffb627" stroke-width="2"/>

  <!-- conveyor -->
  <rect x="60" y="284" width="520" height="28" rx="14" fill="#141d30" stroke="#c9d2e3" stroke-width="2"/>
  <g fill="#0c1322" stroke="#94a0b8" stroke-width="2">
    <circle cx="74" cy="298" r="9"/><circle cx="170" cy="298" r="7"/><circle cx="270" cy="298" r="7"/>
    <circle cx="370" cy="298" r="7"/><circle cx="470" cy="298" r="7"/><circle cx="566" cy="298" r="9"/>
  </g>
  <rect x="440" y="244" width="80" height="40" rx="4" fill="#2a3650" stroke="#94a0b8" stroke-width="2" opacity="0.6"/>
  <rect x="466" y="256" width="28" height="14" rx="2" fill="#38bdf8" opacity="0.6"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a0b8">
    <text x="60" y="346">PROX → LABEL → FILL → LEVEL → NEXT BOX</text>
  </g>
</svg>
